<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO</title>
<style>
  :root { --accent: #4f6df5; --border: #e2e2e6; --muted: #8a8a8f; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #1c1c1e;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { max-width: 520px; margin: 48px auto; background: #fff;
          border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  #new-task { flex: 1 1 200px; padding: 8px 10px; border: 1px solid var(--border);
              border-radius: 8px; font-size: 14px; }
  #new-due { padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  button { cursor: pointer; border: 1px solid var(--border); background: #fff;
           border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  #add-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px;
       border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: none; }
  .text { flex: 1; font-size: 14px; }
  li.completed .text { text-decoration: line-through; color: var(--muted); }
  .due { font-size: 12px; color: var(--muted); }
  li.overdue .due { color: #d23b3b; font-weight: 600; }
  .text input.edit, .due-edit { font-size: 14px; padding: 4px 6px;
       border: 1px solid var(--accent); border-radius: 6px; }
  input.edit { flex: 1; }
  .del { color: var(--muted); border: none; background: none; font-size: 18px; line-height: 1; }
  .count { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>TODO</h1>
    <div class="add-row">
      <input id="new-task" type="text" placeholder="What needs doing?" autocomplete="off">
      <input id="new-due" type="date" aria-label="Due date">
      <button id="add-btn">Add</button>
    </div>
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>
    <ul id="list"></ul>
    <div class="count" id="count"></div>
  </div>
<script>
  const STORAGE_KEY = "todos";
  let todos = [];
  let filter = "all";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      todos = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(todos)) todos = [];
    } catch (e) {
      todos = [];
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${m}-${day}`;
  }
  function isOverdue(t) {
    return !!t.dueDate && !t.completed && t.dueDate < todayStr();
  }
  function visibleTodos() {
    if (filter === "active") return todos.filter(t => !t.completed);
    if (filter === "completed") return todos.filter(t => t.completed);
    return todos;
  }
  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const items = visibleTodos();
    if (items.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing here.";
      list.appendChild(li);
    }
    for (const t of items) {
      const li = document.createElement("li");
      li.dataset.id = t.id;
      if (t.completed) li.classList.add("completed");
      if (isOverdue(t)) li.classList.add("overdue");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.completed;
      cb.className = "toggle";

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = t.text;
      text.title = "Double-click to edit";
      text.addEventListener("dblclick", () => startEdit(li, t));

      li.appendChild(cb);
      li.appendChild(text);

      if (t.dueDate) {
        const due = document.createElement("span");
        due.className = "due";
        due.textContent = "Due " + t.dueDate;
        li.appendChild(due);
      }

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete";
      li.appendChild(del);

      list.appendChild(li);
    }
    const active = todos.filter(t => !t.completed).length;
    document.getElementById("count").textContent =
      `${active} item${active === 1 ? "" : "s"} left`;
  }

  function addTask() {
    const input = document.getElementById("new-task");
    const dueInput = document.getElementById("new-due");
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: uid(), text, completed: false, dueDate: dueInput.value || null });
    input.value = "";
    dueInput.value = "";
    input.focus();
    save();
    render();
  }

  function startEdit(li, t) {
    li.innerHTML = "";
    const edit = document.createElement("input");
    edit.type = "text";
    edit.className = "edit";
    edit.value = t.text;

    const dueEdit = document.createElement("input");
    dueEdit.type = "date";
    dueEdit.className = "due-edit";
    dueEdit.value = t.dueDate || "";

    let done = false;
    function commit() {
      if (done) return;
      done = true;
      const newText = edit.value.trim();
      if (!newText) {
        todos = todos.filter(x => x.id !== t.id);
      } else {
        t.text = newText;
        t.dueDate = dueEdit.value || null;
      }
      save();
      render();
    }
    function cancel() { if (done) return; done = true; render(); }

    edit.addEventListener("keydown", (e) => {
      if (e.key === "Enter") commit();
      else if (e.key === "Escape") cancel();
    });
    edit.addEventListener("blur", commit);
    dueEdit.addEventListener("keydown", (e) => {
      if (e.key === "Enter") commit();
      else if (e.key === "Escape") cancel();
    });

    li.appendChild(edit);
    li.appendChild(dueEdit);
    edit.focus();
    edit.select();
  }

  document.getElementById("add-btn").addEventListener("click", addTask);
  document.getElementById("new-task").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTask();
  });

  const list = document.getElementById("list");
  list.addEventListener("change", (e) => {
    if (!e.target.classList.contains("toggle")) return;
    const id = e.target.closest("li").dataset.id;
    const t = todos.find(t => t.id === id);
    if (t) { t.completed = e.target.checked; save(); render(); }
  });
  list.addEventListener("click", (e) => {
    if (!e.target.classList.contains("del")) return;
    const id = e.target.closest("li").dataset.id;
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  });

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll(".filters button")
        .forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  load();
  render();
</script>
</body>
</html>
